<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahiChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'monospace'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#0a0a0f',
                            panel: '#12121a',
                            card: '#1a1a24',
                            border: '#2a2a3a',
                            hover: '#222230',
                        },
                        accent: {
                            cyan: '#00d4ff',
                            green: '#00ff88',
                            red: '#ff3366',
                            yellow: '#ffcc00',
                            purple: '#a855f7',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0f;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        .font-orbitron { font-family: 'Orbitron', monospace; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
        
        .panel {
            background: #12121a;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
        }
        
        .input-field {
            background: #0a0a0f;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            width: 100%;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }
        .input-field::placeholder { color: #555; }
        
        .btn-primary {
            background: #00d4ff;
            color: #0a0a0f;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-primary:hover {
            background: #33ddff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        
        .btn-danger {
            background: transparent;
            color: #ff3366;
            border: 1px solid #ff3366;
            border-radius: 8px;
            padding: 8px 16px;
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-danger:hover {
            background: #ff3366;
            color: #0a0a0f;
        }
        
        .online-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ff88;
            display: inline-block;
        }
        
        .owner-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: #00d4ff;
            color: #0a0a0f;
            font-size: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
        
        .msg-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            animation: msgIn 0.2s ease;
        }
        
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg-own {
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.2);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        
        .msg-other {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-bottom-left-radius: 4px;
        }
        
        .msg-system {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.2);
            text-align: center;
            margin: 0 auto;
            font-size: 12px;
            color: #ff3366;
        }
        
        .tab-btn {
            padding: 12px 16px;
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            color: #666;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn:hover { color: #aaa; }
        .tab-btn.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }
        
        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .user-item:hover { background: #1a1a24; }
        .user-item.active { background: rgba(0, 212, 255, 0.08); border: 1px solid rgba(0, 212, 255, 0.2); }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .timestamp {
            font-size: 10px;
            color: #555;
            font-family: 'Orbitron', monospace;
        }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 14px;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #00d4ff;
            border-radius: 50%;
            animation: typingBounce 1s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        
        .unread-badge {
            background: #ff3366;
            color: #fff;
            font-size: 10px;
            font-family: 'Orbitron', monospace;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" style="position:fixed; inset:0; z-index:100; background:#0a0a0f; display:flex; align-items:center; justify-content:center;">
        <div class="panel" style="width:100%; max-width:380px; padding:40px; margin:20px;">
            <div style="text-align:center; margin-bottom:32px;">
                <h1 class="font-orbitron" style="font-size:28px; color:#00d4ff; letter-spacing:3px; margin-bottom:6px;">MAHICHAT</h1>
                <p class="font-rajdhani" style="color:#555; font-size:14px;">Secure Communication Channel</p>
            </div>
            
            <div style="margin-bottom:20px;">
                <label class="font-orbitron" style="display:block; font-size:10px; color:#00d4ff; margin-bottom:8px; letter-spacing:1px;">USERNAME</label>
                <input type="text" id="loginUser" class="input-field" placeholder="Enter username" autocomplete="off">
            </div>
            
            <div style="margin-bottom:24px;">
                <label class="font-orbitron" style="display:block; font-size:10px; color:#00d4ff; margin-bottom:8px; letter-spacing:1px;">PASSWORD</label>
                <input type="password" id="loginPass" class="input-field" placeholder="Enter password">
            </div>
            
            <button onclick="doLogin()" class="btn-primary" style="width:100%; padding:14px;">ENTER SYSTEM</button>
            
            <p class="font-rajdhani" style="text-align:center; margin-top:20px; color:#444; font-size:13px;">
                New user? Account will be created automatically
            </p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" style="display:none; height:100vh; display:flex; flex-direction:column;">
        
        <!-- TOP BAR -->
        <div style="background:#12121a; border-bottom:1px solid #2a2a3a; padding:0 20px; display:flex; align-items:center; justify-content:space-between; height:56px; flex-shrink:0;">
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:32px; height:32px; background:#00d4ff; border-radius:8px; display:flex; align-items:center; justify-content:center;">
                    <span class="font-orbitron" style="color:#0a0a0f; font-size:14px; font-weight:800;">M</span>
                </div>
                <div>
                    <span class="font-orbitron" style="color:#00d4ff; font-size:13px; font-weight:600;">MAHICHAT</span>
                    <span style="color:#333; margin:0 8px;">|</span>
                    <span id="headerUser" class="font-rajdhani" style="color:#888; font-size:14px;"></span>
                    <span id="headerBadge"></span>
                </div>
            </div>
            <button onclick="doLogout()" class="btn-danger">LOGOUT</button>
        </div>

        <div style="display:flex; flex:1; overflow:hidden;">
            
            <!-- SIDEBAR -->
            <div style="width:280px; background:#12121a; border-right:1px solid #2a2a3a; display:flex; flex-direction:column; flex-shrink:0;">
                
                <!-- TABS -->
                <div style="display:flex; border-bottom:1px solid #2a2a3a;">
                    <button onclick="switchTab('global')" id="tabGlobal" class="tab-btn active" style="flex:1;">GLOBAL</button>
                    <button onclick="switchTab('private')" id="tabPrivate" class="tab-btn" style="flex:1;">PRIVATE</button>
                </div>

                <!-- GLOBAL USER LIST -->
                <div id="globalList" style="flex:1; overflow-y:auto; padding:8px;">
                    <div class="font-orbitron" style="padding:12px 12px 8px; font-size:10px; color:#444; letter-spacing:1px;">ONLINE USERS</div>
                    <div id="onlineUsers"></div>
                </div>

                <!-- PRIVATE CHAT LIST -->
                <div id="privateList" style="display:none; flex:1; overflow-y:auto; padding:8px;">
                    <div class="font-orbitron" style="padding:12px 12px 8px; font-size:10px; color:#444; letter-spacing:1px;">CONVERSATIONS</div>
                    <div id="privateChats"></div>
                </div>
            </div>

            <!-- CHAT AREA -->
            <div style="flex:1; display:flex; flex-direction:column; background:#0a0a0f;">
                
                <!-- CHAT HEADER -->
                <div style="padding:14px 20px; border-bottom:1px solid #2a2a3a; display:flex; align-items:center; gap:10px;">
                    <span id="chatTitle" class="font-orbitron" style="color:#e2e8f0; font-size:13px;">GLOBAL CHANNEL</span>
                    <span id="chatStatus" class="online-dot" style="display:none;"></span>
                    <span id="chatTyping" class="font-rajdhani" style="color:#00d4ff; font-size:12px; display:none;">typing...</span>
                </div>

                <!-- MESSAGES -->
                <div id="messagesArea" style="flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:8px;"></div>

                <!-- INPUT -->
                <div style="padding:14px 20px; border-top:1px solid #2a2a3a; display:flex; gap:10px;">
                    <input type="text" id="msgInput" class="input-field" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()" class="btn-primary" style="padding:10px 24px;">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ========================================
        // FIREBASE CONFIG - GANTI INI
        // ========================================
        const firebaseConfig = {
  apiKey: "AIzaSyD3oa-IMRp7K6pHR2mEzEZy5QSnLl8w220",
  authDomain: "dark-new.firebaseapp.com",
  databaseURL: "https://dark-new-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dark-new",
  storageBucket: "dark-new.firebasestorage.app",
  messagingSenderId: "742928896156",
  appId: "1:742928896156:web:aa29240deeddb023a29d59",
  measurementId: "G-Q5Q6FDXLD1"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ========================================
        // CONFIG
        // ========================================
        const OWNER_USERNAME = "owner";

        // ========================================
        // STATE
        // ========================================
        let me = null;
        let currentTab = "global";
        let currentPrivate = null;
        let unreadCounts = {};
        let typingTimeouts = {};

        // ========================================
        // LOGIN
        // ========================================
        async function doLogin() {
            const username = document.getElementById("loginUser").value.trim().toLowerCase();
            const password = document.getElementById("loginPass").value;

            if (!username || !password) {
                alert("Username and password required");
                return;
            }

            const userRef = db.ref("users/" + username);
            const snap = await userRef.once("value");
            const exists = snap.exists();

            if (!exists) {
                await userRef.set({
                    username: username,
                    password: password,
                    createdAt: Date.now(),
                    isOwner: username === OWNER_USERNAME
                });
            } else {
                const data = snap.val();
                if (data.password !== password) {
                    alert("Wrong password");
                    return;
                }
            }

            me = {
                username: username,
                isOwner: username === OWNER_USERNAME
            };

            // Set online
            const onlineRef = db.ref("online/" + username);
            await onlineRef.set({
                username: username,
                isOwner: me.isOwner,
                joinedAt: Date.now()
            });
            onlineRef.onDisconnect().remove();

            // Show app
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("mainApp").style.display = "flex";
            document.getElementById("headerUser").textContent = username;

            if (me.isOwner) {
                document.getElementById("headerBadge").innerHTML = 
                    `<span class="owner-badge">OWNER</span>`;
            }

            listenOnline();
            listenGlobalMessages();
            listenPrivateMessages();
        }

        function doLogout() {
            if (me) {
                db.ref("online/" + me.username).remove();
            }
            location.reload();
        }

        // ========================================
        // ONLINE USERS
        // ========================================
        function listenOnline() {
            db.ref("online").on("value", snap => {
                const users = snap.val() || {};
                const container = document.getElementById("onlineUsers");
                container.innerHTML = "";

                Object.values(users).forEach(user => {
                    const div = document.createElement("div");
                    div.className = "user-item";
                    div.onclick = () => startPrivateChat(user.username, user.isOwner);

                    const badge = user.isOwner 
                        ? `<span class="owner-badge">OWNER</span>` 
                        : "";

                    div.innerHTML = `
                        <div class="avatar" style="background:${stringColor(user.username)}; color:#0a0a0f;">
                            ${user.username.charAt(0).toUpperCase()}
                        </div>
                        <div style="flex:1; min-width:0;">
                            <div style="display:flex; align-items:center;">
                                <span class="font-rajdhani" style="font-weight:600; font-size:14px; color:#e2e8f0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${user.username}</span>
                                ${badge}
                            </div>
                            <div style="display:flex; align-items:center; gap:4px; margin-top:2px;">
                                <span class="online-dot" style="width:6px; height:6px;"></span>
                                <span class="font-rajdhani" style="font-size:11px; color:#555;">online</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        // ========================================
        // TABS
        // ========================================
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById("tabGlobal").classList.toggle("active", tab === "global");
            document.getElementById("tabPrivate").classList.toggle("active", tab === "private");
            document.getElementById("globalList").style.display = tab === "global" ? "block" : "none";
            document.getElementById("privateList").style.display = tab === "private" ? "block" : "none";

            if (tab === "global") {
                currentPrivate = null;
                document.getElementById("chatTitle").textContent = "GLOBAL CHANNEL";
                document.getElementById("chatStatus").style.display = "none";
                loadGlobalMessages();
            } else {
                renderPrivateList();
                if (currentPrivate) {
                    loadPrivateMessages(currentPrivate);
                } else {
                    document.getElementById("messagesArea").innerHTML = "";
                    document.getElementById("chatTitle").textContent = "SELECT A CONVERSATION";
                }
            }
        }

        // ========================================
        // GLOBAL CHAT
        // ========================================
        let globalMessages = [];

        function listenGlobalMessages() {
            db.ref("messages/global").limitToLast(100).on("child_added", snap => {
                const msg = snap.val();
                globalMessages.push(msg);
                if (currentTab === "global") {
                    appendMessage(msg, "global");
                }
            });
        }

        function loadGlobalMessages() {
            const area = document.getElementById("messagesArea");
            area.innerHTML = "";
            globalMessages.forEach(msg => appendMessage(msg, "global", true));
        }

        // ========================================
        // PRIVATE CHAT
        // ========================================
        function startPrivateChat(targetUsername, isOwner) {
            if (targetUsername === me.username) return;
            
            currentTab = "private";
            currentPrivate = targetUsername;
            switchTab("private");

            const chatId = getChatId(me.username, targetUsername);
            if (!unreadCounts[chatId]) unreadCounts[chatId] = 0;

            document.getElementById("chatTitle").innerHTML = `
                ${targetUsername}
                ${isOwner ? '<span class="owner-badge">OWNER</span>' : ''}
            `;
            document.getElementById("chatStatus").style.display = "inline-block";

            loadPrivateMessages(targetUsername);
        }

        function getChatId(u1, u2) {
            return [u1, u2].sort().join("_");
        }

        function listenPrivateMessages() {
            db.ref("messages/private").on("child_added", snap => {
                const msg = snap.val();
                const chatId = getChatId(msg.from, msg.to);
                
                if (msg.to === me.username && msg.from !== me.username) {
                    if (currentTab !== "private" || currentPrivate !== msg.from) {
                        unreadCounts[chatId] = (unreadCounts[chatId] || 0) + 1;
                        if (currentTab === "private") renderPrivateList();
                    }
                }

                if (currentTab === "private" && currentPrivate && 
                    (msg.from === currentPrivate || msg.to === currentPrivate)) {
                    appendMessage(msg, "private");
                }
            });
        }

        function loadPrivateMessages(target) {
            const area = document.getElementById("messagesArea");
            area.innerHTML = "";

            db.ref("messages/private").once("value", snap => {
                const messages = snap.val() || {};
                const chatId = getChatId(me.username, target);
                
                Object.values(messages).forEach(msg => {
                    if (getChatId(msg.from, msg.to) === chatId) {
                        appendMessage(msg, "private", true);
                    }
                });
            });
        }

        function renderPrivateList() {
            const container = document.getElementById("privateChats");
            container.innerHTML = "";

            db.ref("online").once("value", snap => {
                const users = snap.val() || {};
                
                Object.values(users).forEach(user => {
                    if (user.username === me.username) return;
                    
                    const chatId = getChatId(me.username, user.username);
                    const unread = unreadCounts[chatId] || 0;
                    const isActive = currentPrivate === user.username;

                    const div = document.createElement("div");
                    div.className = "user-item" + (isActive ? " active" : "");
                    div.onclick = () => startPrivateChat(user.username, user.isOwner);

                    div.innerHTML = `
                        <div class="avatar" style="background:${stringColor(user.username)}; color:#0a0a0f;">
                            ${user.username.charAt(0).toUpperCase()}
                        </div>
                        <div style="flex:1; min-width:0;">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span class="font-rajdhani" style="font-weight:600; font-size:14px; color:#e2e8f0;">${user.username}</span>
                                ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ''}
                            </div>
                            <div style="display:flex; align-items:center; gap:4px; margin-top:2px;">
                                <span class="online-dot" style="width:6px; height:6px;"></span>
                                <span class="font-rajdhani" style="font-size:11px; color:#555;">online</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        // ========================================
        // SEND MESSAGE
        // ========================================
        function sendMessage() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (!text) return;

            const msg = {
                from: me.username,
                text: text,
                timestamp: Date.now()
            };

            if (currentTab === "global") {
                msg.displayName = me.username + (me.isOwner ? " [OWNER]" : "");
                db.ref("messages/global").push(msg);
            } else if (currentTab === "private" && currentPrivate) {
                msg.to = currentPrivate;
                db.ref("messages/private").push(msg);
                
                // Clear unread
                const chatId = getChatId(me.username, currentPrivate);
                unreadCounts[chatId] = 0;
                renderPrivateList();
            }

            input.value = "";
        }

        // ========================================
        // APPEND MESSAGE TO UI
        // ========================================
        function appendMessage(msg, type, skipAnim) {
            const area = document.getElementById("messagesArea");
            const isOwn = msg.from === me.username;

            const div = document.createElement("div");
            div.style.display = "flex";
            div.style.flexDirection = "column";
            div.style.alignItems = isOwn ? "flex-end" : "flex-start";
            if (!skipAnim) div.style.animation = "msgIn 0.2s ease";

            let nameHtml = "";
            let badgeHtml = "";

            if (type === "global") {
                const isOwner = msg.displayName && msg.displayName.includes("[OWNER]");
                const displayName = msg.displayName ? msg.displayName.replace(" [OWNER]", "") : msg.from;
                
                badgeHtml = isOwner ? '<span class="owner-badge">OWNER</span>' : "";
                nameHtml = `<span class="font-rajdhani" style="font-weight:600; font-size:12px; color:#888; margin-bottom:4px; display:block;">${displayName}${badgeHtml}</span>`;
            }

            const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

            div.innerHTML = `
                ${nameHtml}
                <div class="msg-bubble ${isOwn ? 'msg-own' : 'msg-other'}">
                    <span class="font-rajdhani" style="color:#e2e8f0;">${escapeHtml(msg.text)}</span>
                    <span class="timestamp" style="display:block; margin-top:4px; text-align:${isOwn ? 'left' : 'right'};">${time}</span>
                </div>
            `;

            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        // ========================================
        // UTILS
        // ========================================
        function stringColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const colors = ["#00d4ff", "#00ff88", "#a855f7", "#ffcc00", "#ff3366", "#f472b6"];
            return colors[Math.abs(hash) % colors.length];
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
